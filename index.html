<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مست بازی 🍻</title>
<style>
:root{--bg:#0d0a1f;--card:#1a1438d9;--tx:#f3eeff;--ac:#ff3d8b;--ac2:#7c4dff;--mut:#a79bd0;--bd:#3a2f6e;--glow:#ff3d8b77;color-scheme:dark}
:root[data-theme="light"]{--bg:#fff3e0;--card:#fffffff2;--tx:#2b2140;--mut:#7a6f8f;--bd:#f0dcc0;--glow:#ff3d8b33;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;min-height:100vh;background:radial-gradient(circle at 15% 0,#2d1266 0,transparent 45%),radial-gradient(circle at 95% 100%,#0a3d5c 0,transparent 45%),var(--bg);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
:root[data-theme="light"] body{background:var(--bg)}
#bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}#bg span{position:absolute;bottom:-50px;opacity:.22;animation:fl2 linear infinite}
@keyframes fl2{to{transform:translateY(-115vh) rotate(40deg)}}
#tb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);left:8px;z-index:5}#tb button{padding:4px 10px;margin:2px;background:var(--card);border:1px solid var(--bd);font-size:16px;box-shadow:none;color:var(--tx)}
#app{position:relative;z-index:1;max-width:480px;margin:auto;padding:46px 18px 24px;text-align:center}
h1{font-size:25px;margin:8px 0}h2{font-size:20px;margin:8px 0}
.logo{font-size:40px;background:linear-gradient(90deg,#ff3d8b,#ffd400,#00e5ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px #ff3d8b88)}
.wob{animation:wob 2s ease-in-out infinite}@keyframes wob{50%{transform:rotate(14deg) scale(1.12)}}
.card{background:var(--card);border:2px solid var(--bd);border-radius:20px;padding:16px;margin:12px 0;backdrop-filter:blur(6px)}
button{font:inherit;border:0;border-radius:14px;padding:12px 18px;margin:5px;background:var(--ac);color:#fff;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 0 14px var(--glow)}
button.alt{background:var(--ac2);box-shadow:0 0 14px #7c4dff77}button.hot{background:#e11d48}button.ghost{background:transparent;color:var(--tx);border:2px solid var(--bd);box-shadow:none}button.sm{padding:6px 12px;font-size:14px}button.on{outline:3px solid var(--ac2)}button:disabled{opacity:.45}
input,textarea{font:inherit;width:100%;padding:12px;border-radius:12px;border:2px solid var(--bd);background:#0000002e;color:var(--tx);font-size:16px;margin:4px 0}
:root[data-theme="light"] input,:root[data-theme="light"] textarea{background:#fff8}
textarea{min-height:100px}.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.big{font-size:54px}.mut{color:var(--mut);font-size:14px}.cm{font-size:19px;line-height:1.8}.code{font-size:34px;letter-spacing:6px;color:var(--ac);direction:ltr;text-shadow:0 0 14px var(--glow)}
.row{display:flex;justify-content:space-between;align-items:center;padding:6px 4px;border-bottom:1px solid var(--bd)}
.av{display:inline-block;width:28px;height:28px;line-height:28px;border-radius:50%;background:var(--bd);text-align:center;margin-left:6px}
.pop{animation:pp .4s}@keyframes pp{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.coin{display:inline-block;font-size:70px;filter:drop-shadow(0 0 12px #ffd40099)}.flip{animation:fl .9s}@keyframes fl{to{transform:rotateY(1440deg)}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);color:var(--tx);border:2px solid var(--bd);margin:0;padding:14px 8px;box-shadow:none;font-size:15px}.te{font-size:34px}.tile:not(:disabled):active{border-color:var(--ac)}
.pl{position:absolute;width:46px;text-align:center;font-size:10px;background:var(--card);border:2px solid var(--bd);border-radius:10px;padding:2px 0;overflow:hidden;white-space:nowrap}.pl.hit{border-color:var(--ac);background:var(--ac);color:#fff}
.pcard{position:relative;width:150px;height:210px;margin:10px auto;background:#fff;color:#111;border-radius:14px;box-shadow:0 8px 24px #0006,0 0 22px var(--glow);animation:kf .7s}.pcard.red{color:#d62839}
.pcard .cn{position:absolute;font-weight:800;font-size:22px;line-height:1.1;text-align:center}.pcard .c1{top:8px;left:10px}.pcard .c2{bottom:8px;right:10px;transform:rotate(180deg)}.pcard .mid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:76px}
@keyframes kf{0%{transform:rotateY(90deg) scale(.6)}100%{transform:rotateY(0) scale(1)}}
.deck{width:70px;height:98px;margin:6px auto;border-radius:10px;background:repeating-linear-gradient(45deg,#7c4dff 0 6px,#ff3d8b 6px 12px);border:3px solid #fff;box-shadow:0 4px 12px #0006}
.bar{height:14px;border-radius:7px;background:var(--bd);overflow:hidden;margin:4px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .8s}
.cf{position:fixed;top:-14px;width:9px;height:14px;z-index:9;pointer-events:none;animation:cfall linear forwards}@keyframes cfall{to{transform:translateY(108vh) rotate(720deg)}}
.shk{animation:shk .5s}@keyframes shk{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
</style></head><body><div id="bg"></div><div id="tb"><button id="thb" onclick="toggleTheme()">🌙</button><button id="snb" onclick="toggleSnd()">🔊</button></div><div id="app"></div>
<script>
var IDEAS=['وسط بازی قهر می‌کنه','همیشه آخرین تکه رو می‌خوره','تو بازی تقلب می‌کنه','ریموت رو قایم می‌کنه','خیلی دیر حاضر می‌شه','پیام می‌بینه و جواب نمی‌ده 👻','تو مهمونی اول غذا می‌خوره، آخر کمک می‌کنه','هر حرفی بزنی می‌گه «من که از اول می‌دونستم»','می‌گه ۵ دقیقه دیگه می‌رسم ولی ۱ ساعت بعد میاد'];
var ws,st=null,saved=null,lastKey='',draft='',rounds=5,rt=null,rejoin=false,MEDAL=['🥇','🥈','🥉'];
function $(h){document.getElementById('app').innerHTML=h}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function tok(){try{var k=sessionStorage.getItem('k');if(!k){k=Math.random().toString(36).slice(2)+Date.now().toString(36);sessionStorage.setItem('k',k)}return k}catch(e){return window.__k||(window.__k=Math.random().toString(36).slice(2)+Date.now())}}
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function connect(cb){if(ws){ws.onclose=null;try{ws.close()}catch(e){}}
ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onopen=cb;ws.onerror=function(){if(!st&&saved&&!saved.code){saved=null;alert(NOSRV)}};
ws.onmessage=function(e){var m=JSON.parse(e.data);
if(m.kicked){saved=null;st=null;alert('از اتاق خارج شدی');return home()}
if(m.err){alert(m.err);if(!st||rejoin){saved=null;st=null;rejoin=false;home()}return}
st=m;rejoin=false;saved.code=m.code;draw()};
ws.onclose=function(){if(saved&&saved.code){clearTimeout(rt);rt=setTimeout(reconnect,1500)}}}
function reconnect(){if(!saved||!saved.code)return;connect(function(){rejoin=true;send({t:'join',name:saved.name,code:saved.code,k:tok()})})}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&saved&&saved.code&&(!ws||ws.readyState>1)){clearTimeout(rt);reconnect()}});
function home(){lastKey='';var c=(location.search.match(/room=(\d+)/)||[])[1]||'';
$('<div class="big wob">🍻</div><h1 class="logo">مست بازی</h1><p class="mut">دورهمی • خنده • شیطنت 😈</p><div class="card"><input id="nm" placeholder="اسمت چیه؟" maxlength="14"><input id="cd" placeholder="کد اتاق (اگه داری)" inputmode="numeric" value="'+c+'"><button onclick="go(0)">🚪 ورود به اتاق</button><button class="alt" onclick="go(1)">➕ ساخت اتاق جدید</button></div><p class="mut">تا ۲۰ نفر • رئیس اتاق همه‌چی رو کنترل می‌کنه</p>')}
function go(create){var n=document.getElementById('nm').value.trim(),c=document.getElementById('cd').value.trim();if(!n)return alert('اسمت رو بنویس');if(!create&&!c)return alert('کد اتاق رو بنویس');
saved={name:n,code:null};st=null;try{connect(function(){send(create?{t:'create',name:n,k:tok()}:{t:'join',name:n,code:c,k:tok()})})}catch(e){saved=null;alert(NOSRV)}}
var NOSRV='به سرور وصل نشدم. صفحه رو باید از لینک سایت (Railway) باز کنی، نه از پیش‌نمایش فایل.';
function nm(id){var p=st.players.filter(function(x){return x.id===id})[0];return p?p.name:'؟'}
function key(){var s=st;if(s.phase==='write')return['w',s.rid,s.mySub].join();
if(s.phase==='lobby')return['l',s.players.map(function(x){return x.id+x.on}).join(),s.done.join(),s.host,s.sel,rounds,lvl,dur].join();
if(s.phase==='pn_setup')return['ps',JSON.stringify(s.g.teams),s.host,s.players.length,s.g.mine].join();return[s.phase,s.rid,s.idx,s.coin,s.host,s.qi,s.g?JSON.stringify(s.g,function(k,v){return k==='now'?undefined:v}):''].join()}
function draw(){var k=key();if(k===lastKey){var p=document.getElementById('prog');if(p)p.textContent=st.got+' از '+st.need+' نفر ثبت کردن';var w=document.getElementById('wc');if(w&&st.g)w.textContent=st.g.words;return}lastKey=k;render()}
function hostBar(){if(st.host!==st.you)return'';return'<div class="card"><p class="mut">👑 کنترل رئیس اتاق</p>'+(st.phase==='write'?'<button class="ghost sm" onclick="if(confirm(\'بدون کسایی که ننوشتن ادامه بدیم؟\'))send({t:\'force\'})">⏭ ادامه بدون بقیه</button>':'')+(st.phase==='pn_turn'?'<button class="ghost sm" onclick="g(\'pe\')">⏭ پایان نوبت</button>':'')+'<button class="ghost sm" onclick="if(confirm(\'برگردیم به لابی؟\'))send({t:\'lobby\'})">🏠 لابی</button></div>'}
function render(){var s=st,H=s.host===s.you,t=s.target===s.you;
if(s.phase==='lobby'){$(lobby(s,H));return}
if(s.g&&gameRender(s,H))return;
var prog='<p class="mut" id="prog">'+s.got+' از '+s.need+' نفر ثبت کردن</p>';
var qh=s.mode==='roast'?'':'<p class="mut">سؤال '+s.qi+' از '+s.qn+(s.mode==='spicy'?' • 😈 شیطونی':'')+'</p>';
if(s.phase==='write'){
if(s.mode==='roast'){
if(t)return $('<div class="big">😬</div><h2>همه دارن درباره‌ی تو می‌نویسن!</h2>'+prog+hostBar());
if(s.mySub)return $('<div class="big pop">🔒</div><h2>ثبت شد!</h2><p class="mut">منتظر بقیه...</p>'+prog+hostBar());
return $('<h2>رفتار بد <span style="color:var(--ac)">'+esc(nm(s.target))+'</span> رو بنویس 😈</h2><p class="mut">اسمت نمیاد!</p><textarea id="tx" maxlength="200" oninput="draft=this.value" placeholder="مثلا: ...">'+esc(draft)+'</textarea><button class="ghost sm" onclick="var e=document.getElementById(\'tx\');e.value=draft=pick(IDEAS)">💡 ایده بده</button><br><button onclick="sub()">✅ ثبت</button>'+prog+hostBar())}
if(s.mySub)return $(qh+'<div class="big pop">🔒</div><h2>ثبت شد!</h2><p class="mut">منتظر بقیه...</p>'+prog+hostBar());
return $(qh+'<h2>'+esc(s.q)+'</h2><p class="mut">یه نفر رو انتخاب کن (مخفی)</p><div class="card chips">'+s.players.filter(function(p){return p.id!==s.you}).map(function(p){return'<button class="'+(s.mode==='spicy'?'hot':'alt')+'" onclick="send({t:\'submit\',v:\''+p.id+'\'})">'+esc(p.name)+'</button>'}).join('')+'</div>'+prog+hostBar())}
if(s.phase==='reveal'){var it=s.item;if(!it)return $('<p class="mut">...</p>'+hostBar());var last=s.idx+1>=s.total;
var top=s.mode==='roast'?'<p class="mut">درباره‌ی '+esc(nm(s.target))+'</p><div class="card pop"><div class="cm">«'+esc(it.t)+'»</div></div>':qh+'<p class="mut">'+esc(s.q)+'</p><div class="card pop"><div class="mut">یکی انتخاب کرده:</div><h1 style="color:var(--ac)">'+esc(it.t)+'</h1></div>';
var bot=s.coin===null?'<p class="mut">کی نوشته؟ شیر = لو می‌ره 😱 | خط = مخفی می‌مونه 🕵️</p><span class="coin" id="coin">🪙</span><br>'+(H?'<button class="alt" onclick="flip()">🪙 شیر یا خط؟</button>':'<p class="mut">منتظر رئیس اتاق برای انداختن سکه...</p>'):(s.coin?'<div class="big pop">😱</div><h2>شیر! نویسنده: <span style="color:var(--ac)">'+esc(it.w)+'</span></h2>':'<div class="big pop">🕵️</div><h2>خط! مخفی موند</h2>')+(H?'<br><button onclick="send({t:\'next\'})">'+(last?'پایان 🎉':'بعدی ➡️')+'</button>':'<p class="mut">منتظر رئیس اتاق...</p>');
return $('<p class="mut">'+(s.idx+1)+' از '+s.total+'</p>'+top+bot+hostBar())}
if(s.phase==='tally'){var tp=s.tally[0],tops=s.tally.filter(function(x){return x.n===tp.n}).map(function(x){return x.name});
return $(qh+'<div class="big pop">🏆</div><h2>'+esc(s.q)+'</h2><div class="card"><h1 style="color:var(--ac)">'+tops.map(esc).join(' و ')+'</h1><p class="mut">با '+tp.n+' رأی</p>'+s.tally.map(function(x){return'<div class="row"><span>'+esc(x.name)+'</span><b>'+x.n+'</b></div>'}).join('')+'</div><div class="card"><p class="mut">چالش برای '+esc(tops[0])+':</p><h2>'+esc(s.dare)+'</h2></div>'+(H?'<button onclick="send({t:\'next\'})">'+(s.qi>=s.qn?'نتیجه‌ی نهایی 🏁':'سؤال بعدی ➡️')+'</button>':'<p class="mut">منتظر رئیس اتاق...</p>')+hostBar())}
if(s.phase==='end'){confetti();snd('win');var body=s.mode==='roast'?'<h1>دور '+esc(nm(s.target))+' تموم شد!</h1><div class="card"><p class="mut">درجه‌ی شیطنت</p><h2>'+s.rank+'</h2><p class="mut">چالش برای '+esc(nm(s.target))+':</p><h2>'+esc(s.dare)+'</h2></div>':'<h1>نتیجه‌ی نهایی 🏁</h1><div class="card">'+(s.scores||[]).map(function(x,i){return'<div class="row"><span>'+(MEDAL[i]||'')+' '+esc(x.name)+'</span><b>'+x.n+' رأی</b></div>'}).join('')+'</div>';
return $('<div class="big pop">🎉</div>'+body+(H?'<button onclick="send({t:\'lobby\'})">🔄 برگشت به لابی</button>':'<p class="mut">منتظر رئیس اتاق...</p>'))}}
function start(m,t){send({t:'start',mode:m,target:t||null,rounds:rounds,lvl:lvl,dur:dur,cases:cases})}
function sub(){var v=(document.getElementById('tx').value||'').trim();if(v){draft='';send({t:'submit',v:v})}}
function flip(){snd('coin');var e=document.getElementById('coin');if(e)e.classList.add('flip');setTimeout(function(){send({t:'flip'})},900)}
var lvl='n',dur=60,cases=3,bAng=0,lastSpin=0,TN=['🔴 تیم قرمز','🔵 تیم آبی'],RN=['مرحله ۱: با جمله توضیح بده (خود کلمه رو نگو!)','مرحله ۲: فقط یه کلمه!','مرحله ۳: پانتومیم، بدون حرف!'];
var RO={def:'😰 تو متهمی! از خودت دفاع کن',pro:'👨‍⚖️ تو دادستانی! ثابت کن مقصره',law:'🧑‍💼 تو وکیل مدافعی!',jury:'🧑‍⚖️ تو عضو هیئت منصفه‌ای',cor:'🤫 تو قاضی فاسدی! رشوه گرفتی'};
function g(a,x){var o={t:'g',a:a};if(x)for(var k in x)o[k]=x[k];send(o)}
function out(h){$(h);return true}
function addW(){var e=document.getElementById('wi'),v=e.value.trim();if(v){g('pw',{v:v});e.value=''}}
setInterval(function(){var e=document.getElementById('cd');if(!e)return;var r=Math.max(0,Math.ceil((+e.getAttribute('data-end')-Date.now())/1000));if(String(r)!==e.textContent){e.textContent=r;if(r>0&&r<=5)snd('tick');if(r===0)snd('buzz')}e.style.color=r<=5?'#e11d48':''},250);
function timer(end){return'<div class="big" id="cd" data-end="'+end+'">⏱</div>'}
function sb(G){return'<div class="card"><div class="row"><span>'+TN[0]+'</span><b>'+G.scores[0]+'</b></div><div class="row"><span>'+TN[1]+'</span><b>'+G.scores[1]+'</b></div></div>'}
function nb(H,a,txt){return H?'<button onclick="g(\''+a+'\')">'+txt+'</button>':'<p class="mut">منتظر رئیس اتاق...</p>'}
function roleCard(G){var r=G.role;return'<div class="card" style="border-color:var(--ac2)"><b>'+RO[r]+'</b>'+(r==='cor'?'<p class="mut">مأموریت مخفی: کاری کن حکم «'+(G.want==='g'?'مجرم':'بی‌گناه')+'» بشه ولی لو نری!</p>':'')+'</div>'}
function leaderboard(sc){var a=Object.keys(sc).map(function(k){return{id:k,n:sc[k]}}).sort(function(x,y){return y.n-x.n});return'<div class="card">'+(a.length?a.map(function(x,i){return'<div class="row"><span>'+(MEDAL[i]||'')+' '+esc(nm(x.id))+'</span><b>'+x.n+'</b></div>'}).join(''):'<p class="mut">هنوز امتیازی نیست</p>')+'</div>'}
function gameRender(s,H){var G=s.g,m=s.mode,ph=s.phase,me=s.you;
if(m==='kings'){
if(ph==='k_end'){confetti();snd('win');setTimeout(shake,100)}if(ph==='k_end')return out('<div class="big pop">👑</div><h1>'+(G.loser?'پادشاه چهارم اومد! '+esc(nm(G.loser))+' باید جام رو بنوشه 🍺':'دسته تموم شد!')+'</h1><p class="mut">مسئولانه بنوشید و رانندگی نکنید 🚫🚗</p>'+(H?'<button onclick="send({t:\'lobby\'})">🔄 برگشت به لابی</button>':''));
var c=G.card,mine=G.cur===me;if(c){snd('card');if(c.r==='K')setTimeout(shake,150)}
return out('<p class="mut">👑 Kings Cup • کارت‌های مونده: '+G.left+' • پادشاه‌ها: '+G.kings+'/4</p>'+(c?pcard(c)+'<h2>'+esc(c.t)+'</h2><p class="cm">'+esc(c.d)+'</p><p class="mut">کارت رو '+esc(nm(G.by))+' کشید</p>':'<div class="deck"></div><p class="mut">دسته آماده‌ست</p>')+(c&&c.r==='J'&&G.by===me?'<input id="ru" maxlength="80" placeholder="قانونت رو بنویس"><button class="alt sm" onclick="var v=document.getElementById(\'ru\').value;if(v)g(\'kr\',{v:v})">📜 ثبت قانون</button>':'')+(G.rules.length?'<div class="card"><b>📜 قانون‌های فعال</b>'+G.rules.map(function(r){return'<div class="row">'+esc(r)+'</div>'}).join('')+'</div>':'')+(mine||H?'<button onclick="g(\'kd\')">🃏 '+(mine?'کارت بکش':'کارت بکش به جای '+esc(nm(G.cur)))+'</button>':'<p class="mut">نوبت '+esc(nm(G.cur))+' برای کشیدن کارته</p>')+'<p class="mut">هر نوشیدنی دلخواهی، لازم نیست الکل باشه 🍹</p>'+hostBar())}
if(m==='pan'){
if(ph==='pn_setup'){var tl=[0,1].map(function(t){return'<div class="card"><b>'+TN[t]+'</b>'+s.players.filter(function(p){return G.teams[p.id]===t}).map(function(p){return'<div class="row"><span>'+avo(p.id)+' '+esc(p.name)+'</span>'+(H?'<button class="ghost sm" onclick="g(\'pt\',{id:\''+p.id+'\'})">↔️</button>':'')+'</div>'}).join('')+'</div>'}).join('');

var muted=false,AC=null;
function snd(t){if(muted)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();var S={tick:[[880,.06]],buzz:[[180,.4]],coin:[[660,.08],[990,.12]],card:[[500,.05],[700,.07]],spin:[[300,.1],[420,.1],[540,.1],[420,.1],[300,.2]],win:[[523,.12],[659,.12],[784,.12],[1047,.3]],pop:[[600,.06]]}[t]||[];var at=AC.currentTime;S.forEach(function(n){var o=AC.createOscillator(),g=AC.createGain();o.type=t==='buzz'?'sawtooth':'triangle';o.frequency.value=n[0];g.gain.setValueAtTime(.15,at);g.gain.exponentialRampToValueAtTime(.001,at+n[1]);o.connect(g);g.connect(AC.destination);o.start(at);o.stop(at+n[1]);at+=n[1]*.9})}catch(e){}}
function confetti(){var c=['#ff4d8d','#7c4dff','#00e5ff','#ffd400','#2ee6a6'];for(var i=0;i<46;i++){var d=document.createElement('i');d.className='cf';d.style.cssText='left:'+Math.random()*100+'vw;background:'+c[i%5]+';animation-duration:'+(1.8+Math.random()*1.6)+'s;animation-delay:'+Math.random()*.4+'s';document.body.appendChild(d);(function(x){setTimeout(function(){x.remove()},3800)})(d)}}
