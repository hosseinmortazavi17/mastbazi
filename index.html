<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بازی نظر مخفی 🤫</title>
<style>
:root{--bg:#fff7e6;--card:#fff;--tx:#2b2140;--ac:#ff5d8f;--ac2:#7c4dff;--mut:#7a6f8f;--bd:#f0dcc0;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1c1530;--card:#2a2147;--tx:#f4eeff;--mut:#b3a8d1;--bd:#42366b;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#app{max-width:480px;margin:auto;padding:18px;text-align:center}h1{font-size:25px;margin:8px 0}h2{font-size:20px;margin:8px 0}
.card{background:var(--card);border:2px solid var(--bd);border-radius:20px;padding:16px;margin:12px 0}
button{font:inherit;border:0;border-radius:14px;padding:12px 18px;margin:5px;background:var(--ac);color:#fff;font-weight:700;font-size:16px;cursor:pointer}
button.alt{background:var(--ac2)}button.hot{background:#e11d48}button.ghost{background:transparent;color:var(--tx);border:2px solid var(--bd)}button.sm{padding:6px 12px;font-size:14px}button.on{outline:3px solid var(--ac2)}button:disabled{opacity:.4}
input,textarea{font:inherit;width:100%;padding:12px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px;margin:4px 0}
textarea{min-height:100px}.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.chip{background:var(--bg);border:2px solid var(--bd);border-radius:99px;padding:4px 10px}.chip.d{opacity:.45}.chip.x{text-decoration:line-through}
.big{font-size:54px}.mut{color:var(--mut);font-size:14px}.cm{font-size:19px;line-height:1.8}.code{font-size:34px;letter-spacing:6px;color:var(--ac);direction:ltr}
.row{display:flex;justify-content:space-between;align-items:center;padding:6px 4px;border-bottom:1px solid var(--bd)}
.pop{animation:pp .4s}@keyframes pp{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.pl{position:absolute;width:46px;text-align:center;font-size:11px;background:var(--card);border:2px solid var(--bd);border-radius:10px;padding:3px 0;overflow:hidden;white-space:nowrap}.pl.hit{border-color:var(--ac);background:var(--ac);color:#fff}.pc{background:#fff;color:#111;border-radius:16px;padding:10px 24px;display:inline-block;font-size:64px;font-weight:800;box-shadow:0 4px 14px #0003}
.coin{display:inline-block;font-size:70px}.flip{animation:fl .9s}@keyframes fl{to{transform:rotateY(1440deg)}}
</style></head><body><div id="app"></div>
<script>
var IDEAS=['وسط بازی قهر می‌کنه','همیشه آخرین تکه رو می‌خوره','تو بازی تقلب می‌کنه','ریموت رو قایم می‌کنه','خیلی دیر حاضر می‌شه','پیام می‌بینه و جواب نمی‌ده 👻','تو مهمونی اول غذا می‌خوره، آخر کمک می‌کنه','هر حرفی بزنی می‌گه «من که از اول می‌دونستم»','می‌گه ۵ دقیقه دیگه می‌رسم ولی ۱ ساعت بعد میاد'];
var ws,st=null,saved=null,lastKey='',draft='',rounds=5,rt=null,rejoin=false,MEDAL=['🥇','🥈','🥉'];
function $(h){document.getElementById('app').innerHTML=h}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function tok(){try{var k=sessionStorage.getItem('k');if(!k){k=Math.random().toString(36).slice(2)+Date.now().toString(36);sessionStorage.setItem('k',k)}return k}catch(e){return window.__k||(window.__k=Math.random().toString(36).slice(2)+Date.now())}}
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function connect(cb){if(ws){ws.onclose=null;try{ws.close()}catch(e){}}
ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onopen=cb;ws.onerror=function(){if(!st&&saved&&!saved.code){saved=null;alert(NOSRV)}};
ws.onmessage=function(e){var m=JSON.parse(e.data);
if(m.kicked){saved=null;st=null;alert('از اتاق خارج شدی');return home()}
if(m.err){alert(m.err);if(!st||rejoin){saved=null;st=null;rejoin=false;home()}return}
st=m;rejoin=false;saved.code=m.code;draw()};
ws.onclose=function(){if(saved&&saved.code){clearTimeout(rt);rt=setTimeout(reconnect,1500)}}}
function reconnect(){if(!saved||!saved.code)return;connect(function(){rejoin=true;send({t:'join',name:saved.name,code:saved.code,k:tok()})})}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&saved&&saved.code&&(!ws||ws.readyState>1)){clearTimeout(rt);reconnect()}});
function home(){lastKey='';var c=(location.search.match(/room=(\d+)/)||[])[1]||'';
$('<div class="big">🤫</div><h1>بازی نظر مخفی</h1><div class="card"><input id="nm" placeholder="اسمت چیه؟" maxlength="14"><input id="cd" placeholder="کد اتاق (اگه داری)" inputmode="numeric" value="'+c+'"><button onclick="go(0)">🚪 ورود به اتاق</button><button class="alt" onclick="go(1)">➕ ساخت اتاق جدید</button></div><p class="mut">تا ۲۰ نفر • رئیس اتاق همه‌چی رو کنترل می‌کنه</p>')}
function go(create){var n=document.getElementById('nm').value.trim(),c=document.getElementById('cd').value.trim();if(!n)return alert('اسمت رو بنویس');if(!create&&!c)return alert('کد اتاق رو بنویس');
saved={name:n,code:null};st=null;try{connect(function(){send(create?{t:'create',name:n,k:tok()}:{t:'join',name:n,code:c,k:tok()})})}catch(e){saved=null;alert(NOSRV)}}
var NOSRV='به سرور وصل نشدم. صفحه رو باید از لینک سایت (Railway) باز کنی، نه از پیش‌نمایش فایل.';
function nm(id){var p=st.players.filter(function(x){return x.id===id})[0];return p?p.name:'؟'}
function key(){var s=st;if(s.phase==='write')return['w',s.rid,s.mySub].join();
if(s.phase==='lobby')return['l',s.players.map(function(x){return x.id+x.on}).join(),s.done.join(),s.host,rounds,lvl,dur,cases].join();
if(s.phase==='pn_setup')return['ps',JSON.stringify(s.g.teams),s.host,s.players.length,s.g.mine].join();return[s.phase,s.rid,s.idx,s.coin,s.host,s.qi,s.g?JSON.stringify(s.g,function(k,v){return k==='now'?undefined:v}):''].join()}
function draw(){var k=key();if(k===lastKey){var p=document.getElementById('prog');if(p)p.textContent=st.got+' از '+st.need+' نفر ثبت کردن';var w=document.getElementById('wc');if(w&&st.g)w.textContent=st.g.words;return}lastKey=k;render()}
function hostBar(){if(st.host!==st.you)return'';return'<div class="card"><p class="mut">👑 کنترل رئیس اتاق</p>'+(st.phase==='write'?'<button class="ghost sm" onclick="if(confirm(\'بدون کسایی که ننوشتن ادامه بدیم؟\'))send({t:\'force\'})">⏭ ادامه بدون بقیه</button>':'')+(st.phase==='pn_turn'?'<button class="ghost sm" onclick="g(\'pe\')">⏭ پایان نوبت</button>':'')+'<button class="ghost sm" onclick="if(confirm(\'برگردیم به لابی؟\'))send({t:\'lobby\'})">🏠 لابی</button></div>'}
function render(){var s=st,H=s.host===s.you,t=s.target===s.you;
if(s.phase==='lobby'){var link=location.origin+'/?room='+s.code;
var list='<div class="card"><b>بازیکن‌ها ('+s.players.length+'/'+s.max+')</b>'+s.players.map(function(p){return'<div class="row"><span>'+(p.id===s.host?'👑 ':'')+esc(p.name)+(p.on?'':' <span class="mut">(آفلاین)</span>')+(s.done.indexOf(p.id)>-1?' ✅':'')+'</span>'+(H&&p.id!==s.you?'<button class="ghost sm" onclick="if(confirm(\'حذف بشه؟\'))send({t:\'kick\',id:\''+p.id+'\'})">✖</button>':'')+'</div>'}).join('')+'</div>';
var ctl=H?'<div class="card"><b>🤫 نظر مخفی درباره‌ی یه نفر</b><p class="mut">این دور درباره‌ی کی؟ (✅ = نوبتش تموم شده)</p><div class="chips">'+s.players.map(function(p){return'<button class="alt sm" onclick="start(\'roast\',\''+p.id+'\')">'+esc(p.name)+(s.done.indexOf(p.id)>-1?' ✅':'')+'</button>'}).join('')+'</div><button onclick="start(\'roast\',null)">🎰 قرعه‌کشی</button>'+(s.done.length?'<br><button class="ghost sm" onclick="send({t:\'reset\'})">♻️ ریست نوبت‌ها</button>':'')+'</div><div class="card"><b>تعداد سؤال‌ها</b><div class="chips">'+[5,8,10].map(function(n){return'<button class="ghost sm'+(rounds===n?' on':'')+'" onclick="rounds='+n+';lastKey=\'\';draw()">'+n+'</button>'}).join('')+'</div><button class="alt" onclick="start(\'who\')">💘 حاضری با کی باشی؟</button><br><button class="hot" onclick="start(\'spicy\')">😈 حالت شیطونی</button><p class="mut">شیطونی: سؤال‌های بی‌ادبانه و چالش‌های خفن، فقط برای جمع بزرگ‌ترها 🔞</p></div><div class="card"><b>🎲 بازی‌های جمعی</b><p class="mut">سطح (برای جرأت‌حقیقت و دادگاه):</p><div class="chips"><button class="ghost sm'+(lvl==='n'?' on':'')+'" onclick="lvl=\'n\';lastKey=\'\';draw()">🎉 بامزه</button><button class="ghost sm'+(lvl==='s'?' on':'')+'" onclick="lvl=\'s\';lastKey=\'\';draw()">😈 شیطونی</button></div><p class="mut">وقت هر نوبت پانتومیم (ثانیه):</p><div class="chips">'+[45,60,90].map(function(n){return'<button class="ghost sm'+(dur===n?' on':'')+'" onclick="dur='+n+';lastKey=\'\';draw()">'+n+'</button>'}).join('')+'</div><p class="mut">تعداد پرونده‌های دادگاه:</p><div class="chips">'+[3,5,8].map(function(n){return'<button class="ghost sm'+(cases===n?' on':'')+'" onclick="cases='+n+';lastKey=\'\';draw()">'+n+'</button>'}).join('')+'</div><button class="alt" onclick="start(\'kings\')">👑 Kings Cup</button><button class="alt" onclick="start(\'pan\')">🎭 پانتومیم ۳ مرحله‌ای</button><button class="alt" onclick="start(\'tod\')">🍾 جرأت یا حقیقت (بطری)</button><button class="hot" onclick="start(\'court\')">⚖️ دادگاه شیطون‌ها</button></div>':'<p class="mut">منتظر رئیس اتاق تا بازی رو شروع کنه...</p>';
return $('<h2>اتاق بازی</h2><div class="code">'+s.code+'</div><p class="mut">لینک رو برای بقیه بفرست:</p><div class="card mut" style="direction:ltr;word-break:break-all">'+esc(link)+'</div><button class="ghost sm" onclick="navigator.clipboard&&navigator.clipboard.writeText(\''+link+'\')">📋 کپی لینک</button>'+list+ctl)}
if(s.g&&gameRender(s,H))return;
var prog='<p class="mut" id="prog">'+s.got+' از '+s.need+' نفر ثبت کردن</p>';
var qh=s.mode==='roast'?'':'<p class="mut">سؤال '+s.qi+' از '+s.qn+(s.mode==='spicy'?' • 😈 شیطونی':'')+'</p>';
if(s.phase==='write'){
if(s.mode==='roast'){
if(t)return $('<div class="big">😬</div><h2>همه دارن درباره‌ی تو می‌نویسن!</h2>'+prog+hostBar());
if(s.mySub)return $('<div class="big pop">🔒</div><h2>ثبت شد!</h2><p class="mut">منتظر بقیه...</p>'+prog+hostBar());
return $('<h2>رفتار بد <span style="color:var(--ac)">'+esc(nm(s.target))+'</span> رو بنویس 😈</h2><p class="mut">اسمت نمیاد!</p><textarea id="tx" maxlength="200" oninput="draft=this.value" placeholder="مثلا: ...">'+esc(draft)+'</textarea><button class="ghost sm" onclick="var e=document.getElementById(\'tx\');e.value=draft=pick(IDEAS)">💡 ایده بده</button><br><button onclick="sub()">✅ ثبت</button>'+prog+hostBar())}
if(s.mySub)return $(qh+'<div class="big pop">🔒</div><h2>ثبت شد!</h2><p class="mut">منتظر بقیه...</p>'+prog+hostBar());
return $(qh+'<h2>'+esc(s.q)+'</h2><p class="mut">یه نفر رو انتخاب کن (مخفی)</p><div class="card chips">'+s.players.filter(function(p){return p.id!==s.you}).map(function(p){return'<button class="'+(s.mode==='spicy'?'hot':'alt')+'" onclick="send({t:\'submit\',v:\''+p.id+'\'})">'+esc(p.name)+'</button>'}).join('')+'</div>'+prog+hostBar())}
if(s.phase==='reveal'){var it=s.item;if(!it)return $('<p class="mut">...</p>'+hostBar());var last=s.idx+1>=s.total;
var top=s.mode==='roast'?'<p class="mut">درباره‌ی '+esc(nm(s.target))+'</p><div class="card pop"><div class="cm">«'+esc(it.t)+'»</div></div>':qh+'<p class="mut">'+esc(s.q)+'</p><div class="card pop"><div class="mut">یکی انتخاب کرده:</div><h1 style="color:var(--ac)">'+esc(it.t)+'</h1></div>';
var bot=s.coin===null?'<p class="mut">کی نوشته؟ شیر = لو می‌ره 😱 | خط = مخفی می‌مونه 🕵️</p><span class="coin" id="coin">🪙</span><br>'+(H?'<button class="alt" onclick="flip()">🪙 شیر یا خط؟</button>':'<p class="mut">منتظر رئیس اتاق برای انداختن سکه...</p>'):(s.coin?'<div class="big pop">😱</div><h2>شیر! نویسنده: <span style="color:var(--ac)">'+esc(it.w)+'</span></h2>':'<div class="big pop">🕵️</div><h2>خط! مخفی موند</h2>')+(H?'<br><button onclick="send({t:\'next\'})">'+(last?'پایان 🎉':'بعدی ➡️')+'</button>':'<p class="mut">منتظر رئیس اتاق...</p>');
return $('<p class="mut">'+(s.idx+1)+' از '+s.total+'</p>'+top+bot+hostBar())}
if(s.phase==='tally'){var tp=s.tally[0],tops=s.tally.filter(function(x){return x.n===tp.n}).map(function(x){return x.name});
return $(qh+'<div class="big pop">🏆</div><h2>'+esc(s.q)+'</h2><div class="card"><h1 style="color:var(--ac)">'+tops.map(esc).join(' و ')+'</h1><p class="mut">با '+tp.n+' رأی</p>'+s.tally.map(function(x){return'<div class="row"><span>'+esc(x.name)+'</span><b>'+x.n+'</b></div>'}).join('')+'</div><div class="card"><p class="mut">چالش برای '+esc(tops[0])+':</p><h2>'+esc(s.dare)+'</h2></div>'+(H?'<button onclick="send({t:\'next\'})">'+(s.qi>=s.qn?'نتیجه‌ی نهایی 🏁':'سؤال بعدی ➡️')+'</button>':'<p class="mut">منتظر رئیس اتاق...</p>')+hostBar())}
if(s.phase==='end'){var body=s.mode==='roast'?'<h1>دور '+esc(nm(s.target))+' تموم شد!</h1><div class="card"><p class="mut">درجه‌ی شیطنت</p><h2>'+s.rank+'</h2><p class="mut">چالش برای '+esc(nm(s.target))+':</p><h2>'+esc(s.dare)+'</h2></div>':'<h1>نتیجه‌ی نهایی 🏁</h1><div class="card">'+(s.scores||[]).map(function(x,i){return'<div class="row"><span>'+(MEDAL[i]||'')+' '+esc(x.name)+'</span><b>'+x.n+' رأی</b></div>'}).join('')+'</div>';
return $('<div class="big pop">🎉</div>'+body+(H?'<button onclick="send({t:\'lobby\'})">🔄 برگشت به لابی</button>':'<p class="mut">منتظر رئیس اتاق...</p>'))}}
function start(m,t){send({t:'start',mode:m,target:t||null,rounds:rounds,lvl:lvl,dur:dur,cases:cases})}
function sub(){var v=(document.getElementById('tx').value||'').trim();if(v){draft='';send({t:'submit',v:v})}}
function flip(){var e=document.getElementById('coin');if(e)e.classList.add('flip');setTimeout(function(){send({t:'flip'})},900)}
var lvl='n',dur=60,cases=3,bAng=0,lastSpin=0,TN=['🔴 تیم قرمز','🔵 تیم آبی'],RN=['مرحله ۱: با جمله توضیح بده (خود کلمه رو نگو!)','مرحله ۲: فقط یه کلمه!','مرحله ۳: پانتومیم، بدون حرف!'];
var RO={def:'😰 تو متهمی! از خودت دفاع کن',pro:'👨‍⚖️ تو دادستانی! ثابت کن مقصره',law:'🧑‍💼 تو وکیل مدافعی!',jury:'🧑‍⚖️ تو عضو هیئت منصفه‌ای',cor:'🤫 تو قاضی فاسدی! رشوه گرفتی'};
function g(a,x){var o={t:'g',a:a};if(x)for(var k in x)o[k]=x[k];send(o)}
function out(h){$(h);return true}
function addW(){var e=document.getElementById('wi'),v=e.value.trim();if(v){g('pw',{v:v});e.value=''}}
setInterval(function(){var e=document.getElementById('cd');if(!e)return;var r=Math.max(0,Math.ceil((+e.getAttribute('data-end')-Date.now())/1000));e.textContent=r;e.style.color=r<=5?'#e11d48':''},250);
function timer(end){return'<div class="big" id="cd" data-end="'+end+'">⏱</div>'}
function sb(G){return'<div class="card"><div class="row"><span>'+TN[0]+'</span><b>'+G.scores[0]+'</b></div><div class="row"><span>'+TN[1]+'</span><b>'+G.scores[1]+'</b></div></div>'}
function nb(H,a,txt){return H?'<button onclick="g(\''+a+'\')">'+txt+'</button>':'<p class="mut">منتظر رئیس اتاق...</p>'}
function roleCard(G){var r=G.role;return'<div class="card" style="border-color:var(--ac2)"><b>'+RO[r]+'</b>'+(r==='cor'?'<p class="mut">مأموریت مخفی: کاری کن حکم «'+(G.want==='g'?'مجرم':'بی‌گناه')+'» بشه ولی لو نری!</p>':'')+'</div>'}
function leaderboard(sc){var a=Object.keys(sc).map(function(k){return{id:k,n:sc[k]}}).sort(function(x,y){return y.n-x.n});return'<div class="card">'+(a.length?a.map(function(x,i){return'<div class="row"><span>'+(MEDAL[i]||'')+' '+esc(nm(x.id))+'</span><b>'+x.n+'</b></div>'}).join(''):'<p class="mut">هنوز امتیازی نیست</p>')+'</div>'}
function gameRender(s,H){var G=s.g,m=s.mode,ph=s.phase,me=s.you;
if(m==='kings'){
if(ph==='k_end')return out('<div class="big pop">👑</div><h1>'+(G.loser?'پادشاه چهارم اومد! '+esc(nm(G.loser))+' باید جام رو بنوشه 🍺':'دسته تموم شد!')+'</h1><p class="mut">مسئولانه بنوشید و رانندگی نکنید 🚫🚗</p>'+(H?'<button onclick="send({t:\'lobby\'})">🔄 برگشت به لابی</button>':''));
var c=G.card,red=c&&(c.s==='♥'||c.s==='♦'),mine=G.cur===me;
return out('<p class="mut">👑 Kings Cup • کارت‌های مونده: '+G.left+' • پادشاه‌ها: '+G.kings+'/4</p>'+(c?'<div class="pc pop" style="color:'+(red?'#d62839':'#111')+'">'+c.r+c.s+'</div><h2>'+esc(c.t)+'</h2><p class="cm">'+esc(c.d)+'</p><p class="mut">کارت رو '+esc(nm(G.by))+' کشید</p>':'<div class="big">🃏</div><p class="mut">دسته آماده‌ست</p>')+(c&&c.r==='J'&&G.by===me?'<input id="ru" maxlength="80" placeholder="قانونت رو بنویس"><button class="alt sm" onclick="var v=document.getElementById(\'ru\').value;if(v)g(\'kr\',{v:v})">📜 ثبت قانون</button>':'')+(G.rules.length?'<div class="card"><b>📜 قانون‌های فعال</b>'+G.rules.map(function(r){return'<div class="row">'+esc(r)+'</div>'}).join('')+'</div>':'')+(mine||H?'<button onclick="g(\'kd\')">🃏 '+(mine?'کارت بکش':'کارت بکش به جای '+esc(nm(G.cur)))+'</button>':'<p class="mut">نوبت '+esc(nm(G.cur))+' برای کشیدن کارته</p>')+'<p class="mut">هر نوشیدنی دلخواهی، لازم نیست الکل باشه 🍹</p>'+hostBar())}
if(m==='pan'){
if(ph==='pn_setup'){var tl=[0,1].map(function(t){return'<div class="card"><b>'+TN[t]+'</b>'+s.players.filter(function(p){return G.teams[p.id]===t}).map(function(p){return'<div class="row"><span>'+esc(p.name)+'</span>'+(H?'<button class="ghost sm" onclick="g(\'pt\',{id:\''+p.id+'\'})">↔️</button>':'')+'</div>'}).join('')+'</div>'}).join('');
return out('<h2>🎭 پانتومیم سه‌مرحله‌ای</h2><p class="mut">کلمه‌ها: <b id="wc">'+G.words+'</b> • سهم من: '+G.mine+'/5</p>'+(G.mine<5?'<input id="wi" maxlength="24" placeholder="یه کلمه یا اسم بامزه بنویس..." onkeydown="if(event.key===\'Enter\')addW()"><button class="alt sm" onclick="addW()">➕ اضافه</button>':'<p class="mut">سهم کلمه‌هات تموم شد ✅</p>')+(H?'<div><button class="ghost sm" onclick="g(\'pb\')">🎲 ۸ کلمه‌ی بامزه و بی‌ادبانه</button><button class="ghost sm" onclick="g(\'pr\')">🔀 تیم‌بندی تصادفی</button></div>':'')+tl+nb(H,'ps','▶️ شروع بازی (حداقل ۴ کلمه)')+hostBar())}
if(ph==='pn_ready')return out(sb(G)+'<p class="mut">'+RN[G.rnd-1]+'</p><h2>'+TN[G.team]+'</h2><div class="big">🎤</div><h1>'+esc(nm(G.desc))+'</h1><p class="mut">کلمه‌های مونده: '+G.left+'</p>'+(G.desc===me||H?'<button onclick="g(\'pg\')">▶️ شروع نوبت ('+G.dur+' ثانیه)</button>':'<p class="mut">منتظر شروع...</p>')+hostBar());
if(ph==='pn_turn'){var end=G.deadline-G.now+Date.now();
if(G.desc===me)return out(timer(end)+'<p class="mut">'+RN[G.rnd-1]+'</p><div class="card pop"><div style="font-size:34px;font-weight:800">'+esc(G.cur||'')+'</div></div><button onclick="g(\'po\')" style="background:#16a34a">✅ درست گفتن</button><button class="ghost" onclick="g(\'pk\')">⏭ رد</button>'+hostBar());
return out(timer(end)+'<h2>'+esc(nm(G.desc))+' داره توضیح می‌ده</h2><p class="mut">'+TN[G.team]+' حدس بزنید! • '+RN[G.rnd-1]+'</p>'+sb(G)+hostBar())}
if(ph==='pn_round')return out('<div class="big pop">🎉</div><h2>مرحله '+G.rnd+' تموم شد!</h2>'+sb(G)+'<p class="mut">'+(G.rnd<3?'مرحله بعد: '+RN[G.rnd]:'')+'</p>'+nb(H,'pn',G.rnd<3?'مرحله بعد ➡️':'نتیجه‌ی نهایی 🏁')+hostBar());
if(ph==='pn_end'){var w=G.scores[0]===G.scores[1]?'مساوی شدید! 🤝':'🏆 برنده: '+TN[G.scores[0]>G.scores[1]?0:1];return out('<div class="big pop">🎭</div><h1>'+w+'</h1>'+sb(G)+(H?'<button onclick="send({t:\'lobby\'})">🔄 برگشت به لابی</button>':''))}}
if(m==='tod'){var n=s.players.length,tg=G.tg,prev=bAng,anim=false;
if(tg&&G.n!==lastSpin){var ti=s.players.findIndex(function(p){return p.id===tg}),ta=ti*360/n,dl=((ta-bAng)%360+360)%360;bAng=bAng+1440+dl;lastSpin=G.n;anim=true}
var circ='<div style="position:relative;width:340px;height:340px;margin:auto;max-width:100%">'+s.players.map(function(p,i){var a=i*360/n,x=170+128*Math.sin(a*Math.PI/180),y=170-128*Math.cos(a*Math.PI/180);return'<div class="pl'+(p.id===tg?' hit':'')+'" style="left:'+(x-23)+'px;top:'+(y-14)+'px">'+esc(p.name.slice(0,6))+'</div>'}).join('')+'<div id="bt" style="position:absolute;left:155px;top:125px;width:30px;height:90px;transform-origin:50% 50%;transform:rotate('+(anim?prev:bAng)+'deg);transition:transform 3.2s cubic-bezier(.15,.8,.2,1)"><svg viewBox="0 0 30 90" width="30" height="90" style="display:block"><rect x="6" y="38" width="18" height="50" rx="7" fill="#2e9e4f"/><rect x="11" y="6" width="8" height="36" rx="3" fill="#2e9e4f"/><rect x="10" y="0" width="10" height="7" rx="2" fill="#c9a227"/></svg></div></div>';
var ctl;if(!tg)ctl='<h2>نوبت '+esc(nm(G.sp))+'</h2>'+(G.sp===me||H?'<button onclick="g(\'ts\')">🍾 بطری رو بچرخون!</button>':'<p class="mut">منتظر چرخوندن بطری...</p>');
else if(!G.ch)ctl='<h2>بطری به '+esc(nm(tg))+' افتاد! 🎯</h2>'+(tg===me?'<button onclick="g(\'tc\',{v:\'t\'})">🙊 حقیقت</button><button class="hot" onclick="g(\'tc\',{v:\'d\'})">🔥 جرأت</button>':'<p class="mut">داره انتخاب می‌کنه...</p>');
else ctl='<p class="mut">'+(G.ch==='t'?'🙊 حقیقت':G.ch==='d'?'🔥 جرأت':'🐔 جریمه')+' برای '+esc(nm(tg))+'</p><div class="card pop"><div class="cm">'+esc(G.text)+'</div></div>'+(tg===me||H?'<button style="background:#16a34a" onclick="g(\'td\')">✅ انجام شد</button>'+(tg===me&&G.ch!=='p'?'<button class="ghost" onclick="g(\'tp\')">🐔 نمی‌تونم</button>':''):'');
$('<p class="mut">🍾 جرأت یا حقیقت • '+(G.lvl==='s'?'😈 شیطونی':'🎉 بامزه')+'</p>'+circ+ctl+hostBar());
if(anim)setTimeout(function(){var e=document.getElementById('bt');if(e)e.style.transform='rotate('+bAng+'deg)'},60);return true}
if(m==='court'){var nmx=function(i){return esc(nm(i))};var hd='<p class="mut">⚖️ دادگاه شیطون‌ها • پرونده '+G.i+' از '+G.n+'</p>';var cr='<div class="card"><div class="cm">«'+esc(G.crime)+'»</div></div>';
if(ph==='ct_intro')return out(hd+'<div class="big pop">🔨</div>'+cr+'<div class="card"><div class="row"><span>😰 متهم</span><b>'+nmx(G.def)+'</b></div><div class="row"><span>👨‍⚖️ دادستان</span><b>'+nmx(G.pro)+'</b></div>'+(G.law?'<div class="row"><span>🧑‍💼 وکیل</span><b>'+nmx(G.law)+'</b></div>':'')+'<div class="row"><span>🧑‍⚖️ هیئت منصفه</span><b>'+G.jury.map(nmx).join('، ')+'</b></div></div>'+roleCard(G)+nb(H,'cn','🔨 شروع دادگاه')+hostBar());
if(ph==='ct_pro')return out(hd+timer(Date.now()+40000)+'<h2>👨‍⚖️ نوبت دادستان: '+nmx(G.pro)+'</h2>'+cr+roleCard(G)+nb(H,'cn','نوبت دفاع ➡️')+hostBar());
if(ph==='ct_def')return out(hd+timer(Date.now()+40000)+'<h2>🧑‍💼 نوبت دفاع: '+(G.law?nmx(G.law)+' و ':'')+nmx(G.def)+'</h2>'+cr+roleCard(G)+nb(H,'cn','رأی‌گیری ➡️')+hostBar());
if(ph==='ct_vote'){var jur=G.jury.indexOf(me)>-1;return out(hd+cr+(jur?(G.myVote?'<div class="big pop">🔒</div><h2>رأیت ثبت شد</h2>':'<h2>رأی تو چیه؟</h2><button class="hot" onclick="g(\'cv\',{v:\'g\'})">⚖️ مجرم</button><button onclick="g(\'cv\',{v:\'i\'})" style="background:#16a34a">😇 بی‌گناه</button>'):'<h2>هیئت منصفه داره رأی می‌ده...</h2>')+'<p class="mut">'+G.got+' از '+G.need+' رأی</p>'+roleCard(G)+(H?'<button class="ghost sm" onclick="g(\'cn\')">⏭ ادامه بدون بقیه</button>':'')+hostBar())}
if(ph==='ct_verdict')return out(hd+'<div class="big pop">'+(G.verdict==='g'?'🔨':'😇')+'</div><h1>حکم: '+(G.verdict==='g'?'مجرم!':'بی‌گناه!')+'</h1><p class="mut">مجرم '+G.tally.g+' • بی‌گناه '+G.tally.i+'</p>'+nb(H,'cn','ادامه ➡️')+hostBar());
if(ph==='ct_sus'){return out(hd+'<h2>🕵️ یه قاضی فاسد بین هیئت منصفه‌ست!</h2><p class="mut">فکر می‌کنی کی رشوه گرفته؟</p>'+(G.mySus?'<div class="big pop">🔒</div><p>حدست: <b>'+nmx(G.mySus)+'</b></p>':'<div class="card chips">'+G.jury.filter(function(j){return j!==me}).map(function(j){return'<button class="alt" onclick="g(\'cs\',{v:\''+j+'\'})">'+nmx(j)+'</button>'}).join('')+'</div>')+'<p class="mut">'+G.susGot+' از '+G.susNeed+' نفر</p>'+(H?'<button class="ghost sm" onclick="g(\'cn\')">⏭ ادامه بدون بقیه</button>':'')+hostBar())}
if(ph==='ct_reveal'){var rv=G.rv;return out(hd+'<div class="big pop">'+(rv.cor?(rv.caught?'🎯':'😈'):'⚖️')+'</div>'+(rv.cor?'<h2>قاضی فاسد: '+nmx(rv.cor)+'</h2><p class="mut">'+(rv.caught?'گیر افتاد!':'در رفت!')+'</p>':'')+'<div class="card"><b>🎲 چالش‌ها</b>'+rv.pun.map(function(i){return'<div class="row"><span>'+nmx(i)+'</span></div><p class="cm">'+esc(rv.dares[i])+'</p>'}).join('')+'</div><div class="card"><b>🏅 امتیازها</b>'+Object.keys(rv.d).map(function(i){return'<div class="row"><span>'+nmx(i)+'</span><b>+'+rv.d[i]+'</b></div>'}).join('')+'</div>'+nb(H,'cn',G.i>=G.n?'نتیجه‌ی نهایی 🏁':'پرونده‌ی بعدی ➡️')+hostBar())}
if(ph==='ct_end')return out('<div class="big pop">🏆</div><h1>نتیجه‌ی نهایی دادگاه</h1>'+leaderboard(G.sc)+(H?'<button onclick="send({t:\'lobby\'})">🔄 برگشت به لابی</button>':''))}
return false}
home();
</script></body></html>
